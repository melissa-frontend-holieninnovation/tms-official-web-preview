    <!-- Theme boot: stamp data-theme before first paint so prerendered HTML
         (which bakes whatever headless Chrome resolved) never flashes the
         wrong theme. Mirrors ThemeContext's key + legacy migration order. -->
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem('theme') ||
            localStorage.getItem('senditgo-v29-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* storage unavailable — ThemeContext stamps it on hydration */
        }
      })();
    </script>
