  <style>
    @font-face {font-family:Magistral;src:url("../fonts/magistral-bold-italic.woff") format("woff");font-weight:700;font-style:italic}
    :root {--page:#fff;--ink:#16243a;--muted:#4c5869;--line:#ced5df;--blue:#003df2;--soft:#f3f5f8}
    * {box-sizing:border-box}
    body {margin:0;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    main {max-width:1120px;margin:auto;padding:clamp(24px,5vw,64px) clamp(18px,4vw,64px)}
    header {margin-bottom:clamp(20px,3vw,36px)}
    h1 {font:italic 700 clamp(32px,5vw,60px)/1.08 Magistral,system-ui;margin:0 0 10px;letter-spacing:-.025em}
    header p {margin:0;color:var(--muted);font-size:clamp(16px,2vw,20px)}
    .pod-choices {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 24px}
    .pod-choices button {border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);text-align:left;padding:10px clamp(7px,2vw,18px);font:650 clamp(13px,2vw,18px)/1.3 system-ui;cursor:pointer}
    .pod-choices button span {display:block;color:var(--muted);font:600 12px/1.5 system-ui}
    .pod-choices button[aria-pressed="true"] {border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--soft)}
    .pod-choices button:focus-visible {outline:2px solid var(--blue);outline-offset:2px}
    @media(prefers-color-scheme:dark){:root{--page:#0a1322;--ink:#f4f7fb;--muted:#bdc9da;--line:#43546a;--blue:#81b5ff;--soft:#152338}}
